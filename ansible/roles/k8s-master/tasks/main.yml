---
- name: Initialize Kubernetes control-plane
  command: >
    kubeadm init
    --pod-network-cidr={{ cluster_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --control-plane-endpoint={{ control_plane_endpoint }}
    --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init
  retries: 2
  delay: 10
  until: kubeadm_init.rc == 0


- name: Create .kube directory for admin
  file:
    path: "/home/{{ k8s_user }}/.kube"
    state: directory
    mode: '0755'
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"


- name: Copy kubeconfig for admin user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ k8s_user }}/.kube/config"
    remote_src: yes
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"
    mode: '0644'


- name: Check cluster nodes
  command: kubectl get nodes --no-headers
  register: nodes
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ k8s_user }}/.kube/config"


- name: Display cluster nodes
  debug:
    var: nodes.stdout_lines


- name: Deploy Calico CNI
  command: >
    kubectl apply -f {{ calico_manifest_url }}
  environment:
    KUBECONFIG: "/home/{{ k8s_user }}/.kube/config"