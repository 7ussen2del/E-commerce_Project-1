---
- name: Check if worker node is already part of the cluster
  command: kubectl get nodes --no-headers -o custom-columns=NAME:.metadata.name
  register: node_list
  failed_when: false
  changed_when: false
  delegate_to: "{{ groups[k8s_master_group][0] }}"
  environment:
    KUBECONFIG: "{{ master_kubeconfig }}"


- name: Skip joining if worker is already joined
  debug:
    msg: "Node {{ inventory_hostname }} is already part of the cluster."
  when: inventory_hostname in node_list.stdout_lines


- name: Generate kubeadm join command on master
  command: kubeadm token create --print-join-command --ttl {{ join_token_ttl }}
  register: join_command
  changed_when: false
  delegate_to: "{{ groups[k8s_master_group][0] }}"
  when: inventory_hostname not in node_list.stdout_lines


- name: Join worker node to Kubernetes cluster
  command: "{{ join_command.stdout }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
  when: inventory_hostname not in node_list.stdout_lines