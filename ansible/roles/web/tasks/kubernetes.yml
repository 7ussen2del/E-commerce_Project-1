---
# 1. Create and enable Swap (Crucial for 2GB RAM / t3.small)
- name: Check if swap file exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file

- name: Create 1GB swap file
  ansible.builtin.command:
    cmd: fallocate -l 1G /swapfile
  when: not swap_file.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not swap_file.stat.exists

- name: Enable swap file
  ansible.builtin.command:
    cmd: swapon /swapfile
  ignore_errors: true

- name: Ensure swap is persistent in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present

# 2. Set SELinux to permissive mode for Amazon Linux 2023
- name: Set SELinux to permissive mode
  ansible.posix.selinux:
    policy: targeted
    state: permissive
  ignore_errors: true

# 3. Load required kernel modules
- name: Ensure kernel modules load on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present

# 4. Kubernetes networking settings
- name: Configure Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/kubernetes.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

# 5. Install and configure containerd
- name: Install containerd
  ansible.builtin.dnf:
    name: containerd
    state: present

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate containerd configuration
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
    creates: /etc/containerd/config.toml

- name: Configure systemd cgroup driver in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Enable and restart containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: restarted

# 6. Add Kubernetes repository and install packages
- name: Add Kubernetes repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: https://pkgs.k8s.io/core:/stable:/v1.30/rpm/
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: https://pkgs.k8s.io/core:/stable:/v1.30/rpm/repodata/repomd.xml.key

- name: Install kubelet kubeadm kubectl
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes

- name: Configure kubelet to tolerate swap
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/kubelet
    line: 'KUBELET_EXTRA_ARGS="--fail-swap-on=false"'
    create: true
    mode: "0644"

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started

# 7. Ensure hostname resolves to internal IP
- name: Ensure hostname is in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ ansible_hostname }} web01"
    state: present

# 8. Initialize Kubernetes control plane
- name: Check if Kubernetes cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_initialized

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    cmd: kubeadm init --pod-network-cidr=10.244.0.0/16 --cri-socket=unix:///run/containerd/containerd.sock --ignore-preflight-errors=Swap,SystemVerification
  when: not kubeadm_initialized.stat.exists
  register: kubeadm_init
  changed_when: true

# 9. Configure kubectl for ec2-user
- name: Create .kube directory
  ansible.builtin.file:
    path: /home/ec2-user/.kube
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Copy Kubernetes admin configuration
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ec2-user/.kube/config
    remote_src: true
    owner: ec2-user
    group: ec2-user
    mode: "0600"

# 10. Wait for API Server health check
- name: Wait for Kubernetes API Server to be healthy
  ansible.builtin.uri:
    url: "https://127.0.0.1:6443/healthz"
    validate_certs: false
    status_code: 200
  register: api_health
  until: api_health.status == 200
  retries: 20
  delay: 5

# 11. Install Flannel CNI & Untaint Node
- name: Install Flannel CNI
  become: true
  become_user: ec2-user
  ansible.builtin.command:
    cmd: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  register: flannel_result
  changed_when: "'created' in flannel_result.stdout or 'configured' in flannel_result.stdout"

- name: Remove control-plane taint
  become: true
  become_user: ec2-user
  ansible.builtin.command:
    cmd: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  register: taint_result
  failed_when:
    - taint_result.rc != 0
    - "'not found' not in taint_result.stderr"
  changed_when: taint_result.rc == 0
