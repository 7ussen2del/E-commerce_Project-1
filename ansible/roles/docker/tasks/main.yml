---
- name: Install Docker
  ansible.builtin.dnf:
    name: "{{ docker_package }}"
    state: present

- name: Start Docker Service
  ansible.builtin.service:
    name: "{{ docker_service }}"
    state: started
    enabled: yes

- name: Add ec2-user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true